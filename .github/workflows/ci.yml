name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Compiles against the *published* go-sdl3, so this only proves no
      # platform-specific import has crept in that would break the browser
      # build. The bundle that actually runs is built in pages.yml against the
      # go-sdl3-wasm fork.
      - name: Build for js/wasm
        run: GOOS=js GOARCH=wasm go build ./...

      # internal/game imports no SDL, so the simulation can be exercised on a
      # runner with no display and no SDL3 installed. This catches panics, NaNs
      # and runaway populations that the unit tests would not.
      - name: Headless smoke test
        run: go run . -headless -ticks 30000 -seed 7

      # Record a scripted session and replay it, comparing a state checksum on
      # every tick. The unit tests cover the replay package; this covers the
      # binary a player actually uses, and it is the check that fails if a
      # simulation change quietly breaks determinism.
      - name: Record and replay
        run: |
          go run . -headless -ticks 20000 -seed 7 -checksum-every 1 -record session.jsonl.gz
          go run . -headless -replay session.jsonl.gz

      - name: Upload the recording
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replay-session
          path: session.jsonl.gz
          if-no-files-found: ignore

  # Whether a recording made on one machine replays on another is not something
  # this project has ever measured. math.Exp and math.Pow take CPU-feature-gated
  # assembly paths on amd64 and differ by GOARCH, so a mismatch here is expected
  # rather than a defect — the job records the answer instead of guessing at it,
  # and does not gate the build.
  cross-machine-replay:
    name: Replay an amd64 recording on arm64 (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Record on linux/amd64
        run: go run . -headless -ticks 20000 -seed 7 -checksum-every 120 -record session.jsonl.gz
      - uses: actions/upload-artifact@v7
        with:
          name: cross-machine-recording
          path: session.jsonl.gz

  cross-machine-replay-arm:
    name: Replay it on macos/arm64 (informational)
    needs: cross-machine-replay
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: cross-machine-recording
      - name: Replay
        run: go run . -headless -replay session.jsonl.gz

  build:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      # go-sdl3 is a purego binding: it dlopens SDL3 at runtime rather than
      # linking it, so every target cross-compiles from this one Linux runner
      # with CGO_ENABLED=0 and no SDK, toolchain or SDL headers.
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null .
