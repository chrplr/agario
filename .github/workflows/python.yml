name: Gymnasium environment

# The failure this catches is protocol drift: the Go server and the Python
# client agree on a wire format that no single-language test can check. Both
# sides therefore have to be built and run together.
on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "**.go"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "**.go"
      - ".github/workflows/python.yml"
  workflow_dispatch: {}

env:
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test the Go side
        run: go test ./internal/agarienv/... ./cmd/agario-env/...

      - name: Build the environment server
        run: go build -o agario-env ./cmd/agario-env

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: pip install -e "python[dev]"

      # Pointing at the binary just built, rather than letting the package build
      # its own, so the test really exercises this commit's server.
      - name: Test
        env:
          AGARIO_ENV_BIN: ${{ github.workspace }}/agario-env
        run: pytest python/tests -q

      # The baselines are the end-to-end check: if greedy stops beating random,
      # the observation encoding or the heading mapping has broken in a way the
      # unit tests cannot see.
      - name: Check the baselines still separate
        env:
          AGARIO_ENV_BIN: ${{ github.workspace }}/agario-env
        run: python python/examples/random_agent.py --episodes 3 --steps 600
